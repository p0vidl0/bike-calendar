<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Календарь велосоревнований 2026 · Таблица</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="theme-menu" id="themeMenu">
      <button class="theme-button" id="themeButton" aria-label="Переключение темы" aria-haspopup="true" aria-expanded="false">◐</button>
      <div class="theme-popover hidden" id="themePopover" role="menu" aria-label="Выбор темы">
        <button class="theme-option" data-theme-mode="auto" role="menuitem">Авто</button>
        <button class="theme-option" data-theme-mode="dark" role="menuitem">Темная</button>
        <button class="theme-option" data-theme-mode="light" role="menuitem">Светлая</button>
      </div>
    </div>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Омск · 2026</p>
          <h1>Календарь велосоревнований</h1>
          <p class="subtitle">Официальные старты, любительские гонки и марафоны в одном месте.</p>
          <nav class="view-switch" aria-label="Переключение вида календаря">
            <a class="view-link" href="./index.html">Карточки</a>
            <a class="view-link is-active" href="./table.html" aria-current="page">Таблица</a>
          </nav>
        </div>
        <label class="toggle">
          <input type="checkbox" id="upcomingOnly" aria-label="Показывать только предстоящие соревнования" />
          <span>Только предстоящие</span>
        </label>
      </header>

      <section class="table-wrap">
        <table class="races-table">
          <thead>
            <tr>
              <th>Дата</th>
              <th>Мероприятие</th>
              <th>Организатор</th>
              <th>Результаты</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            {{TABLE_CONTENT}}
          </tbody>
        </table>
      </section>
      <div id="emptyState" class="empty hidden">Нет событий для отображения.</div>
    </main>

    <script>
      (() => {
        const STORAGE_KEY = "theme-mode";
        const themeButton = document.getElementById("themeButton");
        const themePopover = document.getElementById("themePopover");
        const themeOptions = Array.from(document.querySelectorAll(".theme-option"));
        const themeMenu = document.getElementById("themeMenu");
        const checkbox = document.getElementById("upcomingOnly");
        const rows = Array.from(document.querySelectorAll("tr.race-row"));
        const emptyState = document.getElementById("emptyState");

        function applyTheme(mode) {
          if (mode === "auto") {
            document.documentElement.removeAttribute("data-theme");
          } else {
            document.documentElement.setAttribute("data-theme", mode);
          }
          themeOptions.forEach((button) => {
            button.classList.toggle("is-active", button.dataset.themeMode === mode);
          });
        }

        function initTheme() {
          const savedMode = localStorage.getItem(STORAGE_KEY) || "auto";
          applyTheme(savedMode);
        }

        themeButton.addEventListener("click", () => {
          const isHidden = themePopover.classList.toggle("hidden");
          themeButton.setAttribute("aria-expanded", String(!isHidden));
        });

        themeOptions.forEach((button) => {
          button.addEventListener("click", () => {
            const mode = button.dataset.themeMode;
            localStorage.setItem(STORAGE_KEY, mode);
            applyTheme(mode);
            themePopover.classList.add("hidden");
            themeButton.setAttribute("aria-expanded", "false");
          });
        });

        document.addEventListener("click", (event) => {
          if (!themeMenu.contains(event.target)) {
            themePopover.classList.add("hidden");
            themeButton.setAttribute("aria-expanded", "false");
          }
        });

        function refresh() {
          const onlyUpcoming = checkbox.checked;
          rows.forEach((row) => {
            if (!onlyUpcoming) {
              row.hidden = false;
              return;
            }
            row.hidden = row.getAttribute("data-status") === "past";
          });

          const hasVisible = rows.some((row) => !row.hidden);
          emptyState.classList.toggle("hidden", hasVisible);
        }

        checkbox.addEventListener("change", refresh);
        initTheme();
        refresh();
      })();
    </script>
  </body>
</html>
