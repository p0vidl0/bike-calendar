<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Календарь велосоревнований 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="theme-menu" id="themeMenu">
      <button class="theme-button" id="themeButton" aria-label="Переключение темы" aria-haspopup="true" aria-expanded="false">◐</button>
      <div class="theme-popover hidden" id="themePopover" role="menu" aria-label="Выбор темы">
        <button class="theme-option" data-theme-mode="auto" role="menuitem">Авто</button>
        <button class="theme-option" data-theme-mode="dark" role="menuitem">Темная</button>
        <button class="theme-option" data-theme-mode="light" role="menuitem">Светлая</button>
      </div>
    </div>
    <main class="page">
      <header class="hero">
        <div>
          <p class="eyebrow">Омск · 2026</p>
          <h1>Календарь велосоревнований</h1>
          <p class="subtitle">Официальные старты, любительские гонки и марафоны в одном месте.</p>
          <nav class="view-switch" aria-label="Переключение вида календаря">
            <a class="view-link is-active" href="./index.html" aria-current="page">Карточки</a>
            <a class="view-link" href="./table.html">Таблица</a>
          </nav>
        </div>
      </header>

      <section id="calendar" class="calendar">
        {{CALENDAR_CONTENT}}
      </section>
    </main>

    <script>
      (() => {
        const STORAGE_KEY = "theme-mode";
        const themeButton = document.getElementById("themeButton");
        const themePopover = document.getElementById("themePopover");
        const themeOptions = Array.from(document.querySelectorAll(".theme-option"));
        const themeMenu = document.getElementById("themeMenu");
        function applyTheme(mode) {
          if (mode === "auto") {
            document.documentElement.removeAttribute("data-theme");
          } else {
            document.documentElement.setAttribute("data-theme", mode);
          }
          themeOptions.forEach((button) => {
            button.classList.toggle("is-active", button.dataset.themeMode === mode);
          });
        }

        function initTheme() {
          const savedMode = localStorage.getItem(STORAGE_KEY) || "auto";
          applyTheme(savedMode);
        }

        themeButton.addEventListener("click", () => {
          const isHidden = themePopover.classList.toggle("hidden");
          themeButton.setAttribute("aria-expanded", String(!isHidden));
        });

        themeOptions.forEach((button) => {
          button.addEventListener("click", () => {
            const mode = button.dataset.themeMode;
            localStorage.setItem(STORAGE_KEY, mode);
            applyTheme(mode);
            themePopover.classList.add("hidden");
            themeButton.setAttribute("aria-expanded", "false");
          });
        });

        document.addEventListener("click", (event) => {
          if (!themeMenu.contains(event.target)) {
            themePopover.classList.add("hidden");
            themeButton.setAttribute("aria-expanded", "false");
          }
        });

        initTheme();
      })();
    </script>
  </body>
</html>
